# ut_1h_long_v1 — 1H UT Dynamic Level, long only
#
# Two ways in, both long:
#   A. ut_cross_up      — the UT level flips bullish on a CLOSED 1H bar.
#   B. ut_pullback_long — price is already above the UT level, the EMA stack is
#                         bullish, and price drops back onto the line. This is the
#                         "the yellow line is strong support" idea.
#
# Every threshold below is either taken from the app or measured on XAUUSDT's
# available history. Provenance is in the comments — nothing here is a guess.

name: ut_1h_long_atr
symbol: XAUUSDT
timeframe: 1h

period:
  start: 2026-03-09T00:00:00Z   # XAUUSDT listing — nothing exists before this
  end:   now

# ---------------------------------------------------------------------------
# Session filter
# ---------------------------------------------------------------------------
# NOT a naive Mon-Fri. XAUUSDT is a perpetual and prints bars 24/7, but spot gold
# is shut at the weekend and those bars are thin off-hours flow.
#
# Measured on 4,006 1H bars: a naive Mon-Fri filter in MYT keeps 115 bars of dead
# weekend liquidity (Mon 00:00-05:00 MYT is still Sunday in UTC) and throws away
# 144 bars of prime time (Fri 16:00-22:00 UTC = the New York afternoon, which in
# MYT has already rolled into Saturday).
#
# So we use the real gold session instead, which is the app's own definition
# (core/MarketHours.kt:20-33): Sunday 21:00 UTC -> Friday 22:00 UTC.
session_filter:
  mode: gold_session          # gold_session | weekdays_myt | none

# ---------------------------------------------------------------------------
# Entry
# ---------------------------------------------------------------------------
entry:
  side: long

  any_of:
    # --- A. the flip -------------------------------------------------------
    # 69 occurrences in-session over the full history.
    - signal: ut_cross_up

    # --- B. the pullback ---------------------------------------------------
    # 71 occurrences in-session at 0.6 ATR.
    - all_of:
        - signal: ut_bias_bullish       # close > ut_level: the line is a FLOOR,
                                        # not a ceiling (AlertEngine.kt:164-165)
        - signal: ut_level_near         # |close - ut_level| <= 0.6 * ATR14
        - signal: ema_stack_bullish     # EMA7 > EMA14 > EMA28

  # ⚠️ Deliberately NOT "close > ema_7 AND close > ema_14 AND close > ema_28".
  # That condition is self-defeating: if price has pulled back far enough to touch
  # the UT line it is essentially never still above the fast EMA. Measured on this
  # dataset it fires exactly ONCE in 166 days at 0.6 ATR, versus 71 times for the
  # stack-ordering form above. The stack ordering says "the trend is intact"
  # without demanding price be extended, which is what you actually meant.

  # Distance that counts as "on the line". 0.6 is the app's own UT_NEAR_ATR
  # (analysis/alerts/AlertEngine.kt:47). At 0.3 -> 29 signals, at 1.0 -> 193.
  ut_near_atr: 0.6

  # Stops one setup becoming four trades while price rests on the line.
  cooldown_bars: 4

# ---------------------------------------------------------------------------
# Exit
# ---------------------------------------------------------------------------
# $25 = 1.71x the median 1H ATR-14 (14.58). Sized against the instrument, not
# picked round.
exit:
  take_profit: { mode: atr_mult, value: 1.75 }
  stop_loss:   { mode: atr_mult, value: 1.75 }

  # Measured forward-excursion from a random 1H close:
  #     within  4h  +25 hit 17.8%  -25 hit 19.9%  BOTH 1.3%
  #     within  8h  +25 hit 28.9%  -25 hit 33.3%  BOTH 4.9%
  #     within 24h  +25 hit 49.3%  -25 hit 53.5%  BOTH 22.2%
  #     within 48h  +25 hit 64.5%  -25 hit 69.9%  BOTH 40.5%
  # Past ~24h the "both touched" rate makes the result mostly a statement about
  # intrabar ordering rather than about the setup. 24 bars is the compromise.
  time_stop_bars: 24
  trailing: null

sizing:
  mode: fixed_qty
  qty: 1.0          # 1 unit => $1 P/L per $1 price move

costs:
  taker_fee_bps: 5.5      # 0.055%
  slippage_ticks: 1       # tickSize 0.01, confirmed from instruments-info
  apply_funding: true     # perpetual: funding settles every 4h

execution:
  entry_fill: next_bar_open     # signal confirmed at close of t -> fill at open of t+1
  intrabar_resolution: 1m       # 239,378 1m bars stored, zero gaps

# ---------------------------------------------------------------------------
# Context recorded at the entry bar, for later mining
# ---------------------------------------------------------------------------
# Every timeframe's snapshot uses only bars CLOSED at or before the entry bar's
# close. A 4H bar that has not finished yet is not visible — otherwise the
# feature set would leak the future into the trade that is about to open.
features:
  timeframes: [5m, 15m, 30m, 1h, 4h]
  include:
    - atr_14
    - atr_percent
    - ema_7
    - ema_14
    - ema_28
    - ema_alignment
    - ema_separation_atr
    - extension_atr
    - rsi_14
    - adx_14
    - plus_di
    - minus_di
    - bb_percent_b
    - bb_width
    - bb_width_percentile
    - vwap
    - relative_volume
    - ut_level
    - ut_bias
    - ut_position
    - structure_state
    - bos
    - choch
    - volatility_band
    - volatility_percentile
    - volatility_measured
    - directional_score
    - confirmed_bias
  derived:
    - dist_to_ut_pct
    - dist_to_ema_fast_pct
    - dist_to_ema_slow_pct
    - atr_percentile_250
    - hour_of_day_myt
    - day_of_week_myt
    - session            # asia / london / ny — BACKTEST-ONLY, see OPEN_QUESTIONS Q26
    - bars_since_last_signal
    - funding_rate
    - oi_change_pct_1h
